<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tarjeta</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="shell">
    <section id="auth-view" class="auth card">
      <p class="eyebrow">Digital</p>
      <h1>Tarjeta</h1>
      <div class="tabs">
        <button class="tab active" type="button" data-mode="login">Entrar</button>
        <button class="tab" type="button" data-mode="register">Crear cuenta</button>
      </div>
      <form id="auth-form">
        <label>Usuario <input name="username" required minlength="3" maxlength="20" autocomplete="username" /></label>
        <label>Contrasena <input name="password" type="password" required minlength="6" autocomplete="current-password" /></label>
        <p id="auth-error" class="error" hidden></p>
        <button id="auth-submit" class="primary" type="submit">Entrar</button>
      </form>
    </section>
    <section id="app-view" class="hidden">
      <header>
        <div><p class="eyebrow">Presentacion</p><h1>Tarjeta</h1></div>
        <div class="who"><strong id="user-name"></strong><button id="logout" class="ghost" type="button">Salir</button></div>
      </header>
      <div class="layout">
        <form id="card-form" class="card form">
          <input id="name" placeholder="Nombre" maxlength="40" required />
          <input id="role" placeholder="Rol" maxlength="60" />
          <input id="phone" placeholder="Telefono" maxlength="30" />
          <input id="email" type="email" placeholder="Mail" maxlength="80" />
          <input id="web" placeholder="https://..." maxlength="200" />
          <button class="primary" type="submit">Guardar</button>
        </form>
        <article id="preview" class="card preview"></article>
      </div>
      <p id="form-error" class="error" hidden></p>
      <ul id="list"></ul>
    </section>
  </main>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
